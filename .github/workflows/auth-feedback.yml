name: Auth feedback

on:
  pull_request:
    paths:
      - 'tools/ci/ubuntu-apt-source.sh'
      - 'apps/mobile/**'
      - 'packages/auth_passkey/**'
      - 'packages/openapi/community-auth-api.yaml'
      - 'services/api/internal/authprivacy/community_signup_result*.go'
      - 'services/api/internal/authprivacyhttp/signup_result*.go'
      - 'services/api/authlab/run-email-login-isolated.sh'
      - '.github/workflows/auth-feedback.yml'

permissions:
  contents: read

concurrency:
  group: auth-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-auth-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: false
      - name: Install locked Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze mobile app
        working-directory: apps/mobile
        run: flutter analyze --no-pub
      - name: Run auth UI, email login, and session regressions
        working-directory: apps/mobile
        run: >-
          flutter test --no-pub --reporter expanded
          test/auth_flows_test.dart
          test/registration_recovery_test.dart
          test/auth_api_test.dart
          ../../packages/auth_passkey/test/native_passkey_client_test.dart
          test/passkey_recovery_flow_test.dart
          test/security_management_controller_test.dart
          test/security_management_screen_test.dart
          test/auth_screen_test.dart
          test/email_login_test.dart
          test/email_reset_test.dart
          test/auth_session_controller_test.dart
          test/authority_renewal_regression_test.dart
          test/auth_otp_expiry_test.dart
          test/auth_presentation_test.dart
          test/startup_entry_test.dart
          test/login_home_navigation_test.dart
          test/personal_route_account_test.dart

  registration-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: false
      - name: PostgreSQL tools
        run: |
          bash "$GITHUB_WORKSPACE/tools/ci/ubuntu-apt-source.sh"
          sudo apt-get update
          sudo apt-get install -y postgresql-16 libsqlite3-dev
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Auth HTTP boundary and server checks
        working-directory: services/api
        run: |
          go test -mod=readonly ./internal/authprivacy ./internal/authprivacyhttp ./internal/authprivacyruntime
          go vet -mod=readonly ./internal/authprivacy ./internal/authprivacyhttp ./internal/authprivacyruntime
          go build -mod=readonly ./cmd/api ./cmd/verifier
      - name: Original signup results, late commit fence and email recovery in private PostgreSQL
        working-directory: services/api
        env:
          AUTHLAB_EMAIL_TEST_PATTERN: '^Test(SignupResult|EmailResetPasswordAndPausedCredentials|EmailLogin)'
          AUTHLAB_EMAIL_HTTP_TEST_PATTERN: '^TestHTTPSPostgresEligibilityAndSignup$'
        run: sh authlab/run-email-login-isolated.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: false
      - name: Locked dependencies for actual Dart client
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Actual Dart to public C/V HTTPS and private PostgreSQL registration flow
        working-directory: services/api
        env:
          AUTHLAB_REGISTRATION_FLOW_ONLY: '1'
        run: AUTHLAB_MOBILE_FLUTTER="$(command -v flutter)" sh authlab/run-mobile-isolated.sh
