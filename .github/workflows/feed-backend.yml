name: Feed backend
on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'infra/postgres/**'
      - 'packages/openapi/**'
      - 'packages/post-protocol-vectors/**'
      - 'tools/ci/ubuntu-apt-source.sh'
      - '.github/workflows/feed-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feed-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  feed-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache-dependency-path: services/api/go.sum
      - name: Install PostgreSQL and pinned migration runner
        run: |
          bash "$GITHUB_WORKSPACE/tools/ci/ubuntu-apt-source.sh"
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y postgresql-16 python3-venv redis-server
          go install github.com/pressly/goose/v3/cmd/goose@v3.22.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Private image validator prerequisites
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/feed-image-python"
          "$RUNNER_TEMP/feed-image-python/bin/python" -m pip install -r services/api/media/requirements.txt
          chmod -R go-w services/api/media
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 "$RUNNER_TEMP/feed-image-python/bin/python" -I -B services/api/media/validate_image.py --probe
          "$RUNNER_TEMP/feed-image-python/bin/python" services/api/media/test_validator.py --fixtures "$RUNNER_TEMP/feed-media-fixtures"
      - name: Full OpenAPI validation and legacy contract compatibility
        run: |
          python -m pip install -r packages/openapi/requirements-check.txt
          python packages/openapi/check-specs.py
          python tools/check-community-text-contract.py
      - name: Host tests, formatting, build and vet
        working-directory: services/api
        run: |
          test -z "$(gofmt -l internal/posts internal/authprivacy/community_feed*.go internal/authprivacy/community_post_interactions*.go internal/authprivacy/community_posts_read.go internal/authprivacy/community_post_search*.go internal/authprivacy/community_post_tags*.go internal/authprivacyhttp/post_tag*.go internal/authprivacyhttp/feed*.go internal/authprivacyhttp/post_interactions*.go internal/authprivacyhttp/post_search*.go)"
          go test -mod=readonly ./...
          test -z "$(gofmt -l internal/authprivacyhttp/post_share*.go internal/authprivacyhttp/endpoints.go internal/authprivacyhttp/posts_endpoints.go internal/authprivacyhttp/endtoend_postgres_test.go internal/authprivacyruntime/server.go)"
          test -z "$(gofmt -l internal/authprivacy/community_post_reposts*.go internal/authprivacyhttp/post_reposts*.go internal/posts/reposts.go)"
          test -z "$(gofmt -l internal/rankings internal/authprivacy/community_rank*.go internal/authprivacyhttp/rankings*.go internal/authprivacyruntime/rankings*.go)"
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
      - name: Real SQL, migration upgrade, least privilege and TLS HTTP regression
        env:
          PGPORT: '55439'
          FEED_RANKINGS_REDIS: '1'
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          export FEED_GOOSE="$(go env GOPATH)/bin/goose"
          export POST_MEDIA_PYTHON="$RUNNER_TEMP/feed-image-python/bin/python"
          export POST_MEDIA_FIXTURES="$RUNNER_TEMP/feed-media-fixtures"
          sh services/api/authlab/run-feed-isolated.sh
      - name: Independent checkpoint, cancellation, recovery and C/V Gate regression
        env:
          PGPORT: '55439'
          FEED_TEST_PATTERN: '^(TestAuthorization|TestGate|TestVerifier)'
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          export FEED_GOOSE="$(go env GOPATH)/bin/goose"
          sh services/api/authlab/run-feed-isolated.sh
      - uses: actions/checkout@v4
        with:
          ref: 1d829b2623a6c32830ee1b74fae6c99a436ad3b3
          path: .req002-frozen-baseline
          persist-credentials: false
      - name: Frozen feed batch HTTPS performance (35 percent hard gate)
        env:
          PGPORT: '55440'
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          export FEED_GOOSE="$(go env GOPATH)/bin/goose"
          export POST_MEDIA_PYTHON="$RUNNER_TEMP/feed-image-python/bin/python"
          export POST_MEDIA_FIXTURES="$RUNNER_TEMP/feed-media-fixtures"
          export REQ002_SOURCE="$(git rev-parse HEAD)"
          export REQ002_BASELINE_SOURCE="$GITHUB_WORKSPACE/.req002-frozen-baseline"
          git -C "$REQ002_BASELINE_SOURCE" rev-parse HEAD > "$REQ002_BASELINE_SOURCE/.req002-frozen-baseline"
          export REQ002_PERFORMANCE_DIRECTORY="$RUNNER_TEMP/feed-batch-performance"
          python3 services/api/authlab/test_compare_feed_performance.py
          sh services/api/authlab/run-feed-performance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-batch-performance
          path: ${{ runner.temp }}/feed-batch-performance/
          if-no-files-found: ignore
