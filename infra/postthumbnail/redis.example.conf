# Dedicated, discardable Redis for private post-thumbnail copies. PostgreSQL
# remains authoritative; this instance may be flushed or lost at any time.
# Private paths, ACL passwords and the environment-bound namespace must be
# chosen by the environment owner; this is not a deployment command.
bind 127.0.0.1
protected-mode yes
port 16382
maxmemory 256mb
# Approximate LFU makes pressure remove cold copies instead of failing writes.
maxmemory-policy allkeys-lfu
maxmemory-samples 10
# No persistence: a restart is a planned cold cache, never a recovery source.
save ""
appendonly no
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes
timeout 0
tcp-keepalive 60
aclfile /private/post-thumbnail/users.acl
dir /private/post-thumbnail/data

# Runtime ACL: own namespace only; PING GETRANGE SET UNLINK plus HELLO/CLIENT
# SETNAME handshake. No CONFIG, SCAN, KEYS, FLUSH* or global deletion.
# The ACL file is the only place users are defined when aclfile is set, and the
# implicit default user would otherwise stay enabled with full access. Disable
# it explicitly, then add a representative runtime entry (password out of band):
#   user default off
#   user community_thumbnail_cache on >CHANGE_ME ~hnuhole:post-thumbnail:v1:dev:* +ping +getrange +set +unlink
# The namespace suffix is the deployment environment. Never grant this user
# access to admission, comment-snapshot or verifier keys.
